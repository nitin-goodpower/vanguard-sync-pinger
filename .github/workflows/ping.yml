name: Pull new applicants
on:
  schedule:
    - cron: "7,37 * * * *"   # off the hour/half-hour, when GitHub delays or drops scheduled runs
  workflow_dispatch:
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call /api/cron/sync
        env:
          SYNC_URL: ${{ vars.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SYNC_URL" && test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "$SYNC_URL"
